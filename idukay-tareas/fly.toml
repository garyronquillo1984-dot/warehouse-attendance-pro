# Fly.io — `fly launch --no-deploy --copy-config` then see README.md
app = "tareas-gael-edric"
primary_region = "bog"

[build]

[env]
  TZ_APP = "America/Guayaquil"
  SCHEDULER = "internal"
  DATA_DIR = "/data"

[mounts]
  source = "tareas_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: the hourly sync runs inside this machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
