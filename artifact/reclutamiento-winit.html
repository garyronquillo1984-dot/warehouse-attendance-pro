<style>

  --warn-soft: #FFF4D2;
  --focus: #2E6BE6;
  --bar: #1B2220;
  --bar-ink: #EEF0EC;
  --display: 'Barlow Semi Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --floor: #121715; --panel: #1A201E; --panel-2: #212825; --ink: #E7ECE8; --muted: #A1ABA6; --line: #333E39;
    --tape: #E5B620; --tape-ink: #121715; --go: #43A976; --go-soft: #1B3127; --stop: #EF7468; --stop-soft: #3A1E1B;
    --warn-soft: #39311A; --focus: #7EA6FF; --bar: #0B0F0E; --bar-ink: #E7ECE8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --floor: #121715; --panel: #1A201E; --panel-2: #212825; --ink: #E7ECE8; --muted: #A1ABA6; --line: #333E39;
  --tape: #E5B620; --tape-ink: #121715; --go: #43A976; --go-soft: #1B3127; --stop: #EF7468; --stop-soft: #3A1E1B;
  --warn-soft: #39311A; --focus: #7EA6FF; --bar: #0B0F0E; --bar-ink: #E7ECE8; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--floor); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs button { flex: none; font: inherit; font-weight: 600; font-size: .93rem; color: color-mix(in srgb, var(--bar-ink) 72%, transparent); background: transparent; border: 0; padding: 10px 12px; min-height: 42px; cursor: pointer; border-bottom: 3px solid transparent; }

main { max-width: 1100px; margin: 0 auto; padding-block: 24px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 24px; }

.btn { font: inherit; font-weight: 600; min-height: 42px; padding: 8px 16px; border-radius: 6px; border: 1.5px solid transparent; cursor: pointer; background: var(--ink); color: var(--floor); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }

.tag.sample { background: var(--warn-soft); border-color: var(--tape); color: var(--ink); }
.tag.warn { background: var(--stop-soft); color: var(--stop); border-color: transparent; }
.tag.ok { background: var(--go-soft); color: var(--go); border-color: transparent; }

.ph-preselected { background: var(--warn-soft); border-color: transparent; }

.note { padding: 12px 14px; border-radius: 6px; border-left: 4px solid var(--tape); background: var(--warn-soft); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { background: var(--panel); padding: 14px 16px; display: grid; gap: 3px; align-content: start; }
.kpi b { font-family: var(--display); font-size: 2rem; line-height: 1; }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .93rem; }
th { text-align: left; font-size: .8rem; color: var(--muted); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }

tr.click { cursor: pointer; }
tr.click:hover td { background: var(--panel-2); }
@media (max-width: 700px) {
  table.cards thead { display: none; }

  table.cards tr { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  table.cards td { border: 0; padding: 2px 0; display: flex; gap: 8px; }
  table.cards td::before { content: attr(data-l); color: var(--muted); min-width: 96px; font-size: .85rem; }
  table.cards td:first-child::before { content: none; }
}

.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.col { background: var(--panel); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.col h3 { font-size: .95rem; display: flex; justify-content: space-between; gap: 6px; }
.card { border: 1.5px solid var(--line); border-radius: 6px; padding: 8px; display: grid; gap: 4px; background: var(--panel); }
.card button.name { font: inherit; font-weight: 700; text-align: left; background: none; border: 0; padding: 0; color: inherit; cursor: pointer; }
.card select { min-height: 34px; padding: 3px 6px; font-size: .85rem; }
.phase-h { border-left: 6px solid var(--line); padding-left: 10px; }
.phase-h.preselected { border-color: var(--tape); } .phase-h.authorized { border-color: var(--go); } .phase-h.working { border-color: var(--ink); }

.list { list-style: none; margin: 0; padding: 0; display: grid; align-content: start; }
.list > li { display: flex; gap: 10px 14px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }
.list > li:first-child { border-top: 0; }

.done { text-decoration: line-through; color: var(--muted); }

.pill.pending { background: var(--warn-soft); border-color: transparent; }
.pill.ok { background: var(--go-soft); color: var(--go); border-color: transparent; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 12px; border-left: 3px solid var(--line); display: grid; gap: 8px; }
ol.proto { margin: 0; padding-left: 22px; display: grid; gap: 8px; }

dialog { border: 0; padding: 0; border-radius: 10px; width: min(860px, calc(100vw - 24px)); max-height: calc(100vh - 32px); background: var(--floor); color: var(--ink); }
dialog::backdrop { background: rgb(0 0 0 / .45); }
.dlg-head { position: sticky; top: 0; z-index: 2; background: var(--bar); color: var(--bar-ink); padding: 12px 16px; display: flex; justify-content: space-between; gap: 10px; align-items: center; border-bottom: 4px solid var(--tape); }
.dlg-head .btn.ghost { color: var(--bar-ink); border-color: color-mix(in srgb, var(--bar-ink) 35%, transparent); }
.dlg-body { padding: 16px; display: grid; gap: 16px; }

.kiosk { position: fixed; inset: 0; z-index: 50; background: var(--floor); overflow-y: auto; padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.kiosk-in { max-width: 640px; margin: 0 auto; background: var(--panel); border-radius: 10px; border-left: 10px solid var(--tape); padding: 22px; display: grid; gap: 16px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--floor); padding: 10px 16px; border-radius: 6px; z-index: 60; font-weight: 600; max-width: calc(100vw - 32px); }
.empty { text-align: left; padding: 28px 20px; display: grid; gap: 10px; justify-items: start; }
</style>

<header class="top">
  <div class="top-in">

<script>
'use strict';
// ---------------------------------------------------------------- language
const S = {
  lang: (() => { try { return localStorage.getItem('rw.lang') || 'es'; } catch { return 'es'; } })(),
  tab: (() => { const h = location.hash.slice(1); return h || 'panel'; })(),
  db: null, uid: null, ready: false, offline: false, dl: null,
  cands: [], tasks: [], openings: [], acts: [], agencies: [], coord: [], settings: {},
  f: { q: '', phase: '', stage: '', source: '', shift: '', pos: '', ready: false, stale: false, dup: false, hold: false, closed: false },
  period: '30', rkind: 'daily', rday: null, kioskSource: 'kiosk',
};
const t = (es, en) => (S.lang === 'en' ? en : es);
const L = o => (o ? o[S.lang] : '');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const days = (a, b) => Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 864e5);
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/[^a-zA-Z0-9-]/g, '');
const fmtPhone = p => (p && p.length === 10 ? `(${p.slice(0, 3)}) ${p.slice(3, 6)}-${p.slice(6)}` : p || '');
const nameOf = c => `${c.first} ${c.last}`;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2600); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast(t('Copiado', 'Copied')); }
  catch { toast(t('No se pudo copiar: selecciona el texto y cópialo', 'Could not copy: select the text and copy it')); }
}

// ---------------------------------------------------------------- reference data
const STAGES = [
  ['new', 'lead', 'Nuevo candidato', 'New candidate'],
  ['pending_contact', 'lead', 'Pendiente de contacto', 'Pending contact'],
  ['contacted', 'lead', 'Contactado', 'Contacted'],
  ['interested', 'lead', 'Interesado', 'Interested'],
  ['prescreened', 'preselected', 'Preselección', 'Pre-selected'],
  ['application', 'preselected', 'Entrevista o solicitud formal', 'Interview / formal application'],
  ['documents', 'preselected', 'Documentación pendiente', 'Documents pending'],
  ['checks', 'preselected', 'Verificaciones autorizadas pendientes', 'Authorized checks pending'],
  ['approved', 'authorized', 'Aprobado según el proceso', 'Approved by hiring process'],
  ['available', 'authorized', 'Disponible para asignación', 'Available for assignment'],
  ['assigned', 'authorized', 'Asignado a un turno', 'Assigned to a shift'],
  ['first_day_confirmed', 'authorized', 'Primer día confirmado', 'First day confirmed'],
  ['started', 'working', 'Se presentó a trabajar', 'Showed up to work'],
  ['retention', 'working', 'Seguimiento de retención', 'Retention follow-up'],
  ['closed', 'closed', 'No interesado / no disponible / recontactar', 'Not interested / unavailable / recontact'],
].map(([key, phase, es, en]) => ({ key, phase, es, en }));
const SIDX = Object.fromEntries(STAGES.map((s, i) => [s.key, i]));
const phaseOf = k => STAGES[SIDX[k] ?? 0].phase;
const atLeast = (k, min) => k !== 'closed' && SIDX[k] >= SIDX[min];
const stageName = k => L(STAGES[SIDX[k] ?? 0]);
const PHASES = [
  { key: 'lead', es: 'Interesados', en: 'Interested', hint: { es: 'Mostraron interés. Sin preselección ni autorización.', en: 'Showed interest. Not screened, not authorized.' } },
  { key: 'preselected', es: 'Preseleccionados', en: 'Pre-selected', hint: { es: 'Cumplen requisitos reales del puesto. Proceso sin terminar.', en: 'Meet the real job requirements. Process not finished.' } },
  { key: 'authorized', es: 'Autorizados para trabajar', en: 'Authorized to work', hint: { es: 'Aprobados por el proceso de contratación. Se pueden asignar.', en: 'Approved by the hiring process. Can be placed.' } },
  { key: 'working', es: 'Trabajando', en: 'Working', hint: { es: 'Ya empezaron. Seguimiento de retención.', en: 'Started work. Retention follow-up.' } },
  { key: 'closed', es: 'Cerrados', en: 'Closed', hint: { es: 'Se recontactan solo con consentimiento.', en: 'Recontacted only with consent.' } },
];
const opt = (key, es, en) => ({ key, es, en });
const CLOSED = [opt('not_interested', 'No interesado', 'Not interested'), opt('not_available', 'No disponible', 'Not available'), opt('recontact_later', 'Recontactar más tarde', 'Recontact later'), opt('no_show', 'No se presentó', 'Did not show up'), opt('requirements', 'No cumplió requisitos del puesto', 'Did not meet job requirements'), opt('left', 'Dejó la asignación', 'Left the assignment'), opt('other_agency', 'Trabaja con otra agencia', 'Working with another agency'), opt('duplicate', 'Registro duplicado', 'Duplicate record'), opt('other', 'Otro', 'Other')];
const POSITIONS = [opt('picking', 'Picking (surtido)', 'Picking'), opt('packing', 'Empaque', 'Packing'), opt('fulfillment', 'Preparación de pedidos', 'Order fulfillment'), opt('sorting', 'Clasificación', 'Sorting'), opt('material', 'Manejo de materiales', 'Material handling'), opt('receiving', 'Recepción', 'Receiving'), opt('shipping', 'Envíos', 'Shipping'), opt('inventory', 'Inventario', 'Inventory'), opt('other', 'Otro puesto aprobado', 'Other approved role')];
const EXPERIENCE = [...POSITIONS.filter(p => p.key !== 'other'), opt('rf', 'Uso de escáner RF', 'RF scanner use'), opt('quality', 'Control de calidad', 'Quality check'), opt('none', 'Aún sin experiencia', 'No experience yet')];
const EQUIPMENT = [opt('rf', 'Escáner RF', 'RF scanner'), opt('pallet', 'Patín manual', 'Pallet jack'), opt('epallet', 'Patín eléctrico', 'Electric pallet jack'), opt('forklift', 'Montacargas (certificado)', 'Forklift (certified)'), opt('reach', 'Reach truck', 'Reach truck'), opt('picker', 'Order picker', 'Order picker'), opt('conveyor', 'Banda transportadora', 'Conveyor')];
const SHIFTS = [opt('first', '1er turno (día)', '1st shift (day)'), opt('second', '2º turno (tarde)', '2nd shift (evening)'), opt('third', '3er turno (noche)', '3rd shift (night)'), opt('weekend', 'Fines de semana', 'Weekends'), opt('flexible', 'Flexible', 'Flexible')];
const LANGS = [opt('es', 'Español', 'Spanish'), opt('en', 'Inglés', 'English'), opt('other', 'Otro', 'Other')];
const AGENCY = [opt('unknown', 'Aún no se preguntó', 'Not asked yet'), opt('none', 'No está con otra agencia aquí', 'Not with another agency here'), opt('reported', 'Dice que otra agencia lo colocó aquí — en espera', 'Says another agency placed them here — hold'), opt('cleared', 'Aclarado por el supervisor', 'Cleared by supervisor')];

// ---------------------------------------------------------------- storage (private per viewer)
const col = name => S.db.doc(`data/users/${S.uid}/ws`).collection(name);
const settingsDoc = () => S.db.doc(`data/users/${S.uid}/settings`);
const LISTS = { candidates: 'cands', tasks: 'tasks', openings: 'openings', activities: 'acts', agencies: 'agencies', coordination: 'coord' };
// After our own write the local list is updated at once, so a reopened card shows it.
async function put(name, rec) {
  const { id, ...body } = rec;
  const clean = JSON.parse(JSON.stringify(body));
  await col(name).doc(id).set(clean);
  const key = LISTS[name], list = S[key], i = list.findIndex(x => x.id === id);
  if (i >= 0) list[i] = { id, ...clean }; else list.push({ id, ...clean });
}
async function del(name, id) { await col(name).doc(id).delete(); S[LISTS[name]] = S[LISTS[name]].filter(x => x.id !== id); }
async function safe(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    const code = e && e.code;
    toast(code === 'quota_exceeded' ? t('Almacenamiento lleno: elimina registros antiguos o datos de ejemplo.', 'Storage is full: delete old records or sample data.')
      : code === 'invalid_argument' ? t('No se pudo guardar: tu acceso a esta página es de solo lectura.', 'Could not save: your access to this page is read-only.')
      : t('No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.', 'Could not save. Check your connection and try again.'));
    return false;
  }
}

async function boot() {
  const claude = window.claude;
  if (!claude || !claude.use) { S.offline = true; render(); return; }
  const [db, user, dl] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads')]);
  S.dl = dl;
  const uid = user ? await user.id() : null;
  if (!db || !uid) { S.offline = true; render(); return; }
  S.db = db; S.uid = uid;
  let pending = Object.keys(LISTS).length + 1;
  const done = () => { if (--pending === 0) { S.ready = true; render(); } };
  const firstOf = {};
  for (const [name, key] of Object.entries(LISTS)) {
    col(name).onSnapshot(snap => {
      S[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (!firstOf[name]) { firstOf[name] = true; done(); } else liveRender();
    }, () => { if (!firstOf[name]) { firstOf[name] = true; done(); } });
  }
  settingsDoc().onSnapshot(snap => {
    S.settings = snap.exists ? { ...snap.data() } : {};
    if (!firstOf.settings) { firstOf.settings = true; done(); } else liveRender();
  }, () => { if (!firstOf.settings) { firstOf.settings = true; done(); } });
}
// Snapshots re-render the current section, never an open editor or the kiosk.
function liveRender() { if (S.ready) render(); }

const ST = () => ({ stale: 3, lowPool: 3, gContacts: 20, gPrescreen: 10, gInterviews: 5, gShow: 85, gRet30: 70, company: 'Staffing team', myName: '', myPhone: '', applyLink: '', spend: {}, ...S.settings });
function dupOf(c) {
  const other = S.cands.find(x => x.id !== c.id && ((c.phone && x.phone === c.phone) || (c.email && x.email && x.email === c.email)
    || (c.zip && x.zip === c.zip && x.first.toLowerCase() === c.first.toLowerCase() && x.last.toLowerCase() === c.last.toLowerCase())));
  return other ? other.id : null;
}
function readiness(c, o) {
  let s = 0; const r = [];
  const d = c.availableFrom ? days(today(), c.availableFrom) : 0;
  if (d <= 0) { s += 30; r.push(t('disponible ya', 'available now')); } else if (d <= 7) { s += 20; r.push(t('disponible en 7 días', 'available within 7 days')); }
  if ((c.shifts || []).length) { s += 25; r.push(t('turnos indicados', 'shifts given')); }
  if (o && (c.exp || []).includes(o.position)) { s += 20; r.push(t('experiencia en el puesto', 'role experience')); }
  else if ((c.exp || []).some(e => e !== 'none')) { s += 10; r.push(t('experiencia en almacén', 'warehouse experience')); }
  if ((c.equip || []).length) { s += 10; r.push(t('equipos', 'equipment')); }
  if (c.lastContactAt && days(c.lastContactAt.slice(0, 10), today()) <= 7) { s += 15; r.push(t('contactado esta semana', 'contacted this week')); }
  return { score: Math.min(100, s), reasons: r };
}
function inPool(c, o) {
  if (!atLeast(c.stage, 'prescreened') || atLeast(c.stage, 'started') || c.agency === 'reported') return false;
  return c.openingId === o.id || (!c.openingId && ((c.positions || []).includes(o.position) || !(c.positions || []).length));
}
// The furthest stage someone ever reached (closing does not erase progress).
function furthest(c) {
  let best = c.stage === 'closed' ? -1 : SIDX[c.stage];
  for (const h of c.hist || []) if (h.to !== 'closed' && SIDX[h.to] > best) best = SIDX[h.to];
  return best;
}
const reached = (c, min) => furthest(c) >= SIDX[min];

// Follow-up tasks that each stage needs. Ids are deterministic so re-saving never duplicates.
function autoTasks(c, prev) {
  const out = [], close = [];
  const mk = (key, kind, es, en, due) => out.push({ id: `${c.id}--${key}`.slice(0, 190), candId: c.id, kind, title: `${t(es, en)}: ${nameOf(c)}`, due, done: false, auto: key });
  const d0 = today();
  if (!prev) mk('first_contact', 'first_contact', 'Primer contacto', 'First contact', d0);
  if (c.stage !== prev?.stage) {
    if (c.stage === 'interested') mk('prescreen', 'prescreen', 'Preselección contra la vacante', 'Pre-screen against the opening', addDays(d0, 1));
    if (c.stage === 'started') {
      const b = c.firstDay || d0;
      mk('ret7', 'retention', 'Seguimiento día 7', 'Day-7 check-in', addDays(b, 7));
      mk('ret30', 'retention', 'Seguimiento día 30', 'Day-30 check-in', addDays(b, 30));
      mk('ret60', 'retention', 'Seguimiento día 60', 'Day-60 check-in', addDays(b, 60));
    }
    if (c.stage === 'closed' && c.recontactOn) mk('recontact-' + c.recontactOn, 'recontact', 'Recontactar', 'Recontact', c.recontactOn);
    if (!['new', 'pending_contact'].includes(c.stage)) close.push(`${c.id}--first_contact`);
    if (atLeast(c.stage, 'prescreened') || c.stage === 'closed') close.push(`${c.id}--prescreen`);
    if (atLeast(c.stage, 'started') || c.stage === 'closed') S.tasks.filter(x => x.candId === c.id && ['confirm', 'day_check'].includes(x.kind) && !x.done).forEach(x => close.push(x.id));
  }
  if (c.interviewAt && c.interviewAt !== prev?.interviewAt) mk('interview-' + c.interviewAt.replace(/[^0-9]/g, ''), 'interview', 'Entrevista ' + c.interviewAt.slice(11, 16), 'Interview ' + c.interviewAt.slice(11, 16), c.interviewAt.slice(0, 10));
  if (c.firstDay && ['assigned', 'first_day_confirmed'].includes(c.stage) && (c.firstDay !== prev?.firstDay || c.stage !== prev?.stage)) {
    const conf = addDays(c.firstDay, -1);
    mk('confirm-' + c.firstDay, 'confirm', 'Confirmar primer día ' + c.firstDay, 'Confirm first day ' + c.firstDay, conf < d0 ? d0 : conf);
    mk('daycheck-' + c.firstDay, 'day_check', '¿Se presentó? Primer día', 'Did they show up? First day', c.firstDay);
  }
  return { out: out.filter(x => !S.tasks.some(y => y.id === x.id)), close: close.filter(id => S.tasks.some(y => y.id === id && !y.done)) };
}
async function saveCandidate(c, prev) {
  c.dupOf = c.dupOk ? null : dupOf(c);
  if (!prev || prev.stage !== c.stage) {
    c.hist = [...(c.hist || []), { at: new Date().toISOString(), from: prev?.stage || null, to: c.stage }];
    c.stageAt = new Date().toISOString();
  }
  if (!c.consent?.contact) c.consent = { ...(c.consent || {}), sms: false, wa: false, email: false };
  const { out, close } = autoTasks(c, prev);
  const ok = await safe(() => put('candidates', c));
  if (!ok) return false;
  for (const tk of out) await safe(() => put('tasks', tk));
  for (const id of close) { const tk = S.tasks.find(x => x.id === id); if (tk) await safe(() => put('tasks', { ...tk, done: true, doneAt: new Date().toISOString() })); }
  return true;
}
async function logContact(c, kind, outcome, body) {
  const now = new Date().toISOString();
  const n = { ...c, log: [{ at: now, kind, outcome, body }, ...(c.log || [])].slice(0, 120) };
  if (kind !== 'note') n.lastContactAt = now;
  if (['reached', 'replied'].includes(outcome) && ['new', 'pending_contact'].includes(c.stage)) n.stage = 'contacted';
  return saveCandidate(n, c);
}

function filteredCands() {
  const f = S.f, d0 = today(), st = ST();
  const q = f.q.trim().toLowerCase(), dig = q.replace(/\D/g, '');
  return S.cands.filter(c => {
    if (f.phase ? phaseOf(c.stage) !== f.phase : (!f.stage && !f.closed && c.stage === 'closed')) return false;
    if (f.stage && c.stage !== f.stage) return false;
    if (f.source && c.source !== f.source) return false;
    if (f.shift && !(c.shifts || []).includes(f.shift)) return false;
    if (f.pos && !(c.positions || []).includes(f.pos) && !(c.exp || []).includes(f.pos)) return false;
    if (f.ready && c.availableFrom && c.availableFrom > d0) return false;
    if (f.dup && !c.dupOf) return false;
    if (f.hold && c.agency !== 'reported') return false;
    if (f.stale && (c.stage === 'closed' || atLeast(c.stage, 'started') || days((c.lastContactAt || c.registeredAt).slice(0, 10), d0) < st.stale)) return false;
    if (q && !(nameOf(c).toLowerCase().includes(q) || (c.email || '').includes(q) || (dig.length >= 3 && (c.phone || '').includes(dig)))) return false;
    return true;
  }).sort((a, b) => (b.registeredAt || '').localeCompare(a.registeredAt || ''));
}

    <td data-l="${t('Último contacto', 'Last contact')}">${lc === null ? `<span class="muted">${t('Nunca', 'Never')}</span>` : lc === 0 ? t('Hoy', 'Today') : t(`hace ${lc} d`, `${lc} d ago`)}</td>
    <td data-l="${t('Próxima acción', 'Next action')}">${esc(c.nextAction || '—')}${c.nextDue ? `<span class="small ${c.nextDue < d0 ? 'late' : 'muted'}"> · ${esc(c.nextDue)}</span>` : ''}</td></tr>`; }).join('')}

    A(d(21), 'job_fair', 'idea', 'Revisar ferias de empleo NKY (KCC, Chamber, Gateway)', 'Check NKY job fairs (KCC, Chamber, Gateway)'),

    A(d(32), 'review', 'idea', 'Revisión mensual con el supervisor', 'Monthly review with the supervisor'),
    A(d(35), 'job_fair', 'idea', 'Revisar ferias de empleo diciembre–enero', 'Check job fairs December–January'),
    A(d(42), 'follow_up', 'idea', 'Recontactar cerrados que pidieron llamada (con consentimiento)', 'Recontact closed candidates who asked (with consent)'),
    A(d(60), 'review', 'idea', 'Revisión mensual con el supervisor', 'Monthly review with the supervisor'),
    A(d(63), 'job_fair', 'idea', 'Revisar ferias de empleo de febrero', 'Check February job fairs'),
    A(d(84), 'review', 'idea', 'Revisión de 90 días: resultados y recomendaciones', '90-day review: results and recommendations'),
  ];
  for (let w = 0; w < 13; w++) items.push(A(d(w * 7 + 2), 'agency', 'pending', 'Reunión semanal de coordinación entre agencias', 'Weekly agency coordination meeting'));

VIEWS.reportes = () => {
  const st = ST(), d0 = today(), day = S.rday || d0;
  const wd = new Date(day + 'T12:00:00Z').getUTCDay() || 7;
  const from = S.rkind === 'daily' ? day : addDays(day, 1 - wd);
  const to = S.rkind === 'daily' ? day : (addDays(from, 6) > d0 ? d0 : addDays(from, 6));
  const inP = iso => iso && iso.slice(0, 10) >= from && iso.slice(0, 10) <= to;
  const all = S.cands, moves = {};
  all.forEach(c => (c.hist || []).forEach(h => { if (inP(h.at)) moves[h.to] = (moves[h.to] || 0) + 1; }));
  const contacts = all.flatMap(c => (c.log || []).filter(l => l.kind !== 'note' && inP(l.at)).map(() => c.id));
  const nDays = S.rkind === 'daily' ? 1 : Math.min(5, days(from, to) + 1);
  const fd = all.filter(c => c.firstDay && c.firstDay >= from && c.firstDay <= to && c.firstDay < d0 && (atLeast(c.stage, 'assigned') || c.closedReason === 'no_show'));
  const showed = fd.filter(c => atLeast(c.stage, 'started')).length;
  const r30 = all.filter(c => c.ret && c.ret.d30);
  const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '—');
  const coord = S.coord.filter(x => x.date >= from && x.date <= to);
  const rows = [
    [t('Nuevos registros', 'New registrations'), all.filter(c => inP(c.registeredAt)).length, ''],
    [t('Personas contactadas', 'People contacted'), new Set(contacts).size, `${t('meta', 'goal')} ${st.gContacts * nDays}`],
    [t('Intentos de contacto registrados', 'Contact attempts logged'), contacts.length, ''],
    [t('Pasaron a preselección', 'Moved to pre-selected'), moves.prescreened || 0, `${t('meta', 'goal')} ${S.rkind === 'weekly' ? st.gPrescreen : Math.ceil(st.gPrescreen / 5)}`],
    [t('Entrevistas / citas en el período', 'Interviews in period'), all.filter(c => inP(c.interviewAt)).length, `${t('meta', 'goal')} ${S.rkind === 'weekly' ? st.gInterviews : Math.ceil(st.gInterviews / 5)}`],
    [t('Aprobados por el proceso', 'Approved by hiring process'), moves.approved || 0, ''],
    [t('Primeros días confirmados', 'First days confirmed'), moves.first_day_confirmed || 0, ''],
    [t('Se presentaron (primer día)', 'Showed up (first day)'), moves.started || 0, ''],
    [t('No se presentaron', 'No-shows'), all.filter(c => c.closedReason === 'no_show' && inP(c.stageAt)).length, ''],
    [t('Asistencia al primer día', 'First-day show rate'), pct(showed, fd.length), `${t('meta', 'goal')} ${st.gShow}%`],
    [t('Retención a 30 días (acumulada)', '30-day retention (to date)'), pct(r30.filter(c => c.ret.d30 === 'yes').length, r30.length), `${t('meta', 'goal')} ${st.gRet30}%`],
    [t('Autorizados aún sin colocar', 'Authorized, not yet placed'), all.filter(c => ['approved', 'available'].includes(c.stage)).length, ''],
    [t('Seguimientos vencidos ahora', 'Overdue follow-ups now'), S.tasks.filter(x => !x.done && x.due < d0).length, ''],
    [t('Registros de coordinación entre agencias', 'Agency coordination entries'), coord.length, `${coord.filter(x => x.kind === 'escalation').length} ${t('escalamientos', 'escalations')}`],
  ];
  const opens = S.openings.filter(o => o.status === 'authorized').map(o => `• ${o.title}: ${o.headcount} / ${all.filter(c => c.openingId === o.id && atLeast(c.stage, 'assigned')).length} / ${all.filter(c => inPool(c, o)).length}`);
  const srcCount = {}; all.filter(c => inP(c.registeredAt)).forEach(c => { const k = c.source || 'other'; srcCount[k] ||= [0, 0]; srcCount[k][0]++; if (reached(c, 'started')) srcCount[k][1]++; });
  const title = S.rkind === 'daily' ? t('Reporte diario de reclutamiento', 'Daily recruiting report') : t('Reporte semanal de reclutamiento', 'Weekly recruiting report');
  const text = [`${title} — ${st.company} — ${from === to ? from : from + ' → ' + to}`,
    all.some(c => c.sample) ? t('NOTA: incluye datos de EJEMPLO (no son resultados reales).', 'NOTE: includes SAMPLE data (not real results).') : null, '',
    ...rows.map(([a, b, c]) => `• ${a}: ${b}${c ? ` (${c})` : ''}`), '',
    t('Vacantes autorizadas (necesarias / colocadas / grupo listo):', 'Authorized openings (needed / placed / ready pool):'), ...(opens.length ? opens : [t('• ninguna registrada', '• none recorded')]), '',
    t('Fuentes del período (registrados → iniciaron):', 'Sources this period (registered → started):'), ...(Object.keys(srcCount).length ? Object.entries(srcCount).map(([k, [a, b]]) => `• ${srcName(k)}: ${a} → ${b}`) : [t('• sin registros', '• no registrations')])].filter(x => x !== null).join('\n');
  S.lastReport = { text, rows, title, from, to };
  return `<div class="head"><div><h1>${t('Reportes para mi supervisor', 'Reports for my supervisor')}</h1><p class="muted">${t('Solo cantidades: sin nombres, teléfonos ni correos.', 'Counts only: no names, phones or emails.')}</p></div></div>
  <div class="filters"><div class="chips"><button class="chip" data-rkind="daily" aria-pressed="${S.rkind === 'daily'}">${t('Diario', 'Daily')}</button><button class="chip" data-rkind="weekly" aria-pressed="${S.rkind === 'weekly'}">${t('Semanal', 'Weekly')}</button></div>
    <label class="f" style="max-width:220px">${S.rkind === 'daily' ? t('Día', 'Day') : t('Un día de la semana', 'Any day of the week')}<input type="date" id="rday" value="${day}" max="${d0}"></label></div>
  <section class="panel"><h2>${esc(title)}</h2><p class="small muted">${from === to ? from : from + ' → ' + to}</p>
    <div class="scroll"><table><tbody>${rows.map(([a, b, c]) => `<tr><td>${esc(a)}</td><td class="n"><b>${esc(b)}</b></td><td class="small muted">${esc(c)}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="panel"><h2>${t('Texto para correo o chat', 'Text for email or chat')}</h2><pre class="msg" id="report-text">${esc(text)}</pre>
    <div class="row"><button class="btn" data-copy="report-text">${t('Copiar reporte', 'Copy report')}</button>${S.dl ? `<button class="btn ghost" data-act="export-report">CSV</button>` : ''}</div></section>`;
};

function readCandForm(form, base) {
  const fd = new FormData(form), g = k => String(fd.get(k) || '').trim();
  const phone = g('phone').replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
  const err = !g('first') || !g('last') ? t('Escribe nombre y apellido.', 'Enter first and last name.')
    : !phone && !g('email') ? t('Escribe un teléfono o un correo.', 'Enter a phone or an email.')
    : phone && phone.length !== 10 ? t('El teléfono debe tener 10 dígitos.', 'Phone numbers have 10 digits.')
    : g('zip') && !/^\d{5}$/.test(g('zip')) ? t('El código postal tiene 5 dígitos.', 'ZIP code has 5 digits.') : null;
  if (err) return { err };
  const contact = fd.get('cContact') === 'on';
  return { c: { ...base, first: g('first'), last: g('last'), phone, email: g('email').toLowerCase(), city: g('city'), zip: g('zip'), lang: g('lang'),
    source: g('source'), sourceDetail: g('sourceDetail'), exp: chipsVal(form, 'exp'), equip: chipsVal(form, 'equip'), shifts: chipsVal(form, 'shifts'), positions: chipsVal(form, 'positions'),
    availableFrom: g('availableFrom'), openingId: g('openingId'), interviewAt: g('interviewAt'), firstDay: g('firstDay'), nextAction: g('nextAction'), nextDue: g('nextDue'), agency: g('agency'), notes: g('notes'),
    consent: { contact, sms: contact && fd.get('cSms') === 'on', wa: contact && fd.get('cWa') === 'on', email: contact && fd.get('cEmail') === 'on', method: contact ? g('cMethod') : '', at: contact ? (base.consent?.at || new Date().toISOString()) : '' } } };
}

// ---------------------------------------------------------------- CSV
const csvCell = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
async function saveCsv(name, rows) {
  if (!S.dl) { toast(t('Las descargas no están disponibles en esta vista.', 'Downloads are not available in this view.')); return; }
  try { await S.dl.save({ filename: name, data: '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n' }); }
  catch (e) { if (e && e.code !== 'declined') toast(t('No se pudo descargar el archivo.', 'Could not download the file.')); }
}
function exportCands() {
  saveCsv(`candidatos_${today()}.csv`, [[t('Nombre', 'First name'), t('Apellido', 'Last name'), t('Teléfono', 'Phone'), 'Email', t('Ciudad', 'City'), 'ZIP', t('Idioma', 'Language'), t('Etapa', 'Stage'), t('Fuente', 'Source'), t('Registro', 'Registered'), t('Turnos', 'Shifts'), t('Disponible desde', 'Available from'), t('Último contacto', 'Last contact'), t('Próxima acción', 'Next action'), t('Consentimiento', 'Consent'), t('Ejemplo', 'Sample')],
    ...S.cands.map(c => [c.first, c.last, fmtPhone(c.phone), c.email, c.city, c.zip, c.lang, stageName(c.stage), srcName(c.source), (c.registeredAt || '').slice(0, 10), (c.shifts || []).join(' '), c.availableFrom, (c.lastContactAt || '').slice(0, 10), c.nextAction, c.consent?.contact ? 'yes' : 'no', c.sample ? 'SAMPLE' : ''])]);
}
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cell); cell = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
async function importCsv(text) {
  const rows = parseCsv(text.replace(/^﻿/, ''));
  if (rows.length < 2) { toast(t('El CSV no tiene filas.', 'The CSV has no rows.')); return; }
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z]/g, '');
  const H = rows[0].map(norm), find = (...keys) => H.findIndex(h => keys.some(k => h.includes(k)));
  const ix = { first: find('nombre', 'firstname', 'first'), last: find('apellido', 'lastname', 'last'), phone: find('telefono', 'phone', 'celular', 'mobile'), email: find('correo', 'email', 'mail'),
    city: find('ciudad', 'city'), zip: find('codigopostal', 'zip', 'postal'), lang: find('idioma', 'language'), shift: find('turno', 'shift'), consent: find('consent', 'permiso', 'acepto') };
  if (ix.first < 0 || ix.last < 0) { toast(t('Faltan columnas de nombre y apellido.', 'Missing first and last name columns.')); return; }
  let added = 0, skipped = 0;
  for (const r of rows.slice(1)) {
    const g = i => (i >= 0 ? String(r[i] || '').trim() : '');
    const phone = g(ix.phone).replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
    if (!g(ix.first) || !g(ix.last) || (!phone && !g(ix.email)) || (phone && phone.length !== 10)) { skipped++; continue; }
    const yes = /^(s|si|sí|y|yes|true|1|x|acepto|i agree)/i.test(g(ix.consent));
    const sh = norm(g(ix.shift));
    const c = { id: newId(), stage: 'new', registeredAt: new Date().toISOString(), log: [], hist: [], first: g(ix.first), last: g(ix.last), phone, email: g(ix.email).toLowerCase(), city: g(ix.city), zip: /^\d{5}$/.test(g(ix.zip)) ? g(ix.zip) : '',
      lang: /es|spa/.test(norm(g(ix.lang))) ? 'es' : g(ix.lang) ? 'en' : S.lang, source: 'import', shifts: [sh.includes('1') || sh.includes('dia') || sh.includes('day') || sh.includes('first') ? 'first' : null, sh.includes('2') || sh.includes('tarde') || sh.includes('second') || sh.includes('evening') ? 'second' : null, sh.includes('3') || sh.includes('noche') || sh.includes('night') || sh.includes('third') ? 'third' : null].filter(Boolean),
      exp: [], equip: [], positions: [], agency: 'unknown', consent: { contact: yes, sms: false, wa: false, email: false, method: yes ? 'web' : '', at: yes ? new Date().toISOString() : '' } };
    if (dupOf(c)) { skipped++; continue; }
    if (await saveCandidate(c, null)) added++; else break;
  }
  toast(t(`${added} importados, ${skipped} omitidos (incompletos o duplicados)`, `${added} imported, ${skipped} skipped (incomplete or duplicate)`));
}

    if (stg === 'closed') hist.push({ at: addDays(reg.slice(0, 10), 4) + 'T15:00:00.000Z', from: 'interested', to: 'closed' });
    const c = { id: 'sample-' + i, sample: true, first: t('Ejemplo ', 'Sample ') + firsts[i], last: 'Candidato', phone: '85955501' + String(i + 1).padStart(2, '0'), email: `sample${i + 1}@example.com`, city: ['Florence', 'Erlanger', 'Burlington', 'Covington', 'Independence', 'Hebron'][i % 6], zip: ['41042', '41018', '41005', '41011', '41051', '41048'][i % 6],
      lang: i % 3 === 0 ? 'es' : 'en', source: srcs[i % srcs.length], registeredAt: reg, stage: stg, stageAt: hist[hist.length - 1].at, hist, closedReason: stg === 'closed' ? ['not_interested', 'recontact_later', 'not_available'][i % 3] : '',
      exp: i % 4 === 0 ? ['none'] : [pos[i % 5], 'rf'], equip: i % 5 === 0 ? ['pallet'] : [], shifts: [sh[i % 4]], positions: [pos[(i + 1) % 5]], availableFrom: addDays(d0, i % 10),
      openingId: idx >= SIDX.prescreened && stg !== 'closed' ? op.id : '', firstDay: ['assigned', 'first_day_confirmed'].includes(stg) ? addDays(d0, 2) : ['started', 'retention'].includes(stg) ? addDays(d0, -(i % 20) - 8) : '',
      lastContactAt: idx > 1 && stg !== 'new' ? addDays(reg.slice(0, 10), 1) + 'T16:00:00.000Z' : '', log: idx > 1 ? [{ at: addDays(reg.slice(0, 10), 1) + 'T16:00:00.000Z', kind: 'call', outcome: 'reached', body: t('EJEMPLO: primera llamada', 'SAMPLE: first call') }] : [],
      ret: ['started', 'retention'].includes(stg) ? { d7: i % 2 ? 'yes' : 'no' } : {}, nextAction: atLeast(stg, 'started') || stg === 'closed' ? '' : t('Siguiente paso de ejemplo', 'Sample next step'), nextDue: addDays(d0, (i % 5) - 2), agency: 'none',
      consent: { contact: true, sms: i % 2 === 0, wa: false, email: false, method: 'kiosk', at: reg } };
    if (!(await safe(() => put('candidates', c)))) return;
    if (['new', 'pending_contact'].includes(stg)) await safe(() => put('tasks', { id: `${c.id}--first_contact`, candId: c.id, kind: 'first_contact', title: `${t('Primer contacto', 'First contact')}: ${nameOf(c)}`, due: d0, done: false, auto: 'first_contact', sample: true }));
  }
  toast(t('Datos de ejemplo cargados', 'Sample data loaded'));
}
async function removeSamples() {
  for (const c of S.cands.filter(x => x.sample || String(x.id).startsWith('sample-'))) await safe(() => del('candidates', c.id));
  for (const x of S.tasks.filter(x => x.sample || String(x.candId || '').startsWith('sample-'))) await safe(() => del('tasks', x.id));
  for (const o of S.openings.filter(x => x.sample)) await safe(() => del('openings', o.id));
  toast(t('Datos de ejemplo eliminados', 'Sample data removed'));
}

// ---------------------------------------------------------------- events
document.addEventListener('click', async e => {
  const b = e.target.closest('button, a, tr[data-open], [data-open]');
  if (!b) return;
  const ds = b.dataset;
  if (ds.tab) { S.tab = ds.tab; try { history.replaceState(null, '', '#' + ds.tab); } catch {} render(); window.scrollTo(0, 0); return; }
  if (ds.open) { e.preventDefault(); openCandidate(ds.open); return; }
  if (ds.opening) { openingDlg(S.openings.find(o => o.id === ds.opening)); return; }
  if (ds.activity) { activityDlg(S.acts.find(a => a.id === ds.activity)); return; }
  if (ds.coord) { coordDlg(S.coord.find(x => x.id === ds.coord)); return; }
  if (ds.agency) { agencyDlg(S.agencies.find(x => x.id === ds.agency)); return; }
  if (ds.copy) { copy(document.getElementById(ds.copy).textContent); return; }
  if (ds.copytext) { copy(ds.copytext); return; }
  if (ds.ftoggle) { S.f[ds.ftoggle] = !S.f[ds.ftoggle]; b.setAttribute('aria-pressed', S.f[ds.ftoggle]); renderCandList(); return; }
  if (ds.rkind) { S.rkind = ds.rkind; render(); return; }
  if (ds.klang) { S.kioskLang = ds.klang; openKiosk(); return; }
  if (ds.kexit === 'ask') { $('#k-exit').innerHTML = `<span class="small">${t('¿Salir? Solo el reclutador.', 'Exit? Recruiter only.')}</span><button class="btn sm" data-kexit="yes">${t('Sí, salir', 'Yes, exit')}</button><button class="btn ghost sm" data-kexit="no">${t('No', 'No')}</button>`; return; }
  if (ds.kexit === 'yes') { $('#kiosk').hidden = true; $('#kiosk').innerHTML = ''; render(); return; }
  if (ds.kexit === 'no') { $('#k-exit').innerHTML = `<button class="linkbtn small muted" data-kexit="ask">${t('Salir del modo registro', 'Exit registration mode')}</button>`; return; }
  const act = ds.act; if (!act) return;
  const byId = id => S.cands.find(x => x.id === id);
  if (act === 'new-cand') newCandidate();
  else if (act === 'new-opening') openingDlg({});
  else if (act === 'new-act') activityDlg({});
  else if (act === 'new-coord') coordDlg({});
  else if (act === 'new-agency') agencyDlg({});
  else if (act === 'samples-on') { b.disabled = true; await loadSamples(); }
  else if (act === 'samples-off') { b.disabled = true; await removeSamples(); }
  else if (act === 'load-plan') { b.disabled = true; for (const a of suggestedPlan()) if (!(await safe(() => put('activities', a)))) break; toast(t('Plan de 90 días cargado (todo sin confirmar)', '90-day plan loaded (all unconfirmed)')); }
  else if (act === 'toggle-past') { S.showPast = !S.showPast; render(); }
  else if (act === 'export-cands') exportCands();
  else if (act === 'export-report' && S.lastReport) saveCsv(`reporte_${S.lastReport.from}_${S.lastReport.to}.csv`, [[t('Indicador', 'Indicator'), t('Valor', 'Value'), t('Meta / nota', 'Goal / note')], ...S.lastReport.rows]);
  else if (act === 'set-stage') {
    const c = byId(ds.id), stage = $('#st-stage').value;
    const n = { ...c, stage, closedReason: stage === 'closed' ? $('#st-reason').value : '', recontactOn: stage === 'closed' ? $('#st-recontact').value : c.recontactOn };
    if (await saveCandidate(n, c)) { toast(t('Etapa actualizada', 'Stage updated')); openCandidate(c.id); }
  }
  else if (act === 'mark-sent') { const c = byId(ds.id); if (await logContact(c, c.consent?.wa ? 'whatsapp' : c.consent?.sms ? 'sms' : 'email', 'sent', TEMPLATES.find(x => x.code === $('#m-tpl').value)?.[c.lang === 'es' ? 'es' : 'en'][0])) { toast(t('Registrado como enviado', 'Logged as sent')); openCandidate(c.id); } }
  else if (act === 'not-dup') { const c = byId(ds.id); if (await safe(() => put('candidates', { ...c, dupOf: null, dupOk: true }))) { toast(t('Marcado como persona distinta', 'Marked as a different person')); setTimeout(() => openCandidate(c.id), 300); } }
  else if (act === 'del-ask') { $('#del-row').innerHTML = `<button class="btn danger" data-act="del-yes" data-id="${esc(ds.id)}">${t('Sí, eliminar definitivamente', 'Yes, delete permanently')}</button><button class="btn ghost" data-act="del-no" data-id="${esc(ds.id)}">${t('Cancelar', 'Cancel')}</button>`; }
  else if (act === 'del-no') { $('#del-row').innerHTML = `<button class="btn danger" data-act="del-ask" data-id="${esc(ds.id)}">${t('Eliminar…', 'Delete…')}</button>`; }
  else if (act === 'del-yes') { const id = ds.id; if (!id) return; for (const x of S.tasks.filter(x => x.candId === id)) await safe(() => del('tasks', x.id)); if (await safe(() => del('candidates', id), t('Registro eliminado', 'Record deleted'))) d_close(); }
  else if (act === 'del-opening') { if (await safe(() => del('openings', ds.id), t('Vacante eliminada', 'Opening deleted'))) d_close(); }
  else if (act === 'del-act') { if (await safe(() => del('activities', ds.id), t('Actividad eliminada', 'Activity deleted'))) d_close(); }
  else if (act === 'del-agency') { if (await safe(() => del('agencies', ds.id), t('Agencia eliminada', 'Agency deleted'))) d_close(); }
  else if (act === 'import') { const f = $('#csv-file').files[0]; const text = f ? await f.text() : $('#csv-text').value; if (text.trim()) await importCsv(text); }
  else if (act === 'purge-old') {
    const cut = addDays(today(), -365), old = S.cands.filter(c => !atLeast(c.stage, 'started') && ((c.lastContactAt || c.registeredAt || '').slice(0, 10) < cut));
    openDlg(t('Inactivos más de 12 meses', 'Inactive 12+ months'), old.length ? `<p>${t(`${old.length} registros sin actividad en 12 meses. Elimínalos si la política de tu agencia lo indica.`, `${old.length} records with no activity in 12 months. Delete them if your agency’s policy says so.`)}</p><ul class="list">${old.map(c => `<li>${esc(nameOf(c))} <span class="small muted">${esc((c.lastContactAt || c.registeredAt).slice(0, 10))}</span></li>`).join('')}</ul><div><button class="btn danger" data-act="purge-yes">${t('Eliminar estos registros', 'Delete these records')}</button></div>` : `<p>${t('No hay registros inactivos por más de 12 meses.', 'No records inactive for more than 12 months.')}</p>`);
    S._purge = old.map(c => c.id);
  }
  else if (act === 'purge-yes') { for (const id of S._purge || []) { for (const x of S.tasks.filter(x => x.candId === id)) await safe(() => del('tasks', x.id)); await safe(() => del('candidates', id)); } toast(t('Registros eliminados', 'Records deleted')); d_close(); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.matches('input[data-task]')) {
    const tk = S.tasks.find(x => x.id === el.dataset.task);
    if (tk) await safe(() => put('tasks', { ...tk, done: el.checked, doneAt: el.checked ? new Date().toISOString() : '' }));
  } else if (el.matches('select[data-move]')) {
    const c = S.cands.find(x => x.id === el.dataset.move);
    if (c) await saveCandidate({ ...c, stage: el.value, closedReason: el.value === 'closed' ? 'other' : '' }, c);
  } else if (el.matches('select[data-ret]')) {
    const c = S.cands.find(x => x.id === el.dataset.id);
    if (c) await safe(() => put('candidates', { ...c, ret: { ...(c.ret || {}), [el.dataset.ret]: el.value } }), t('Guardado', 'Saved'));
  } else if (el.matches('select[data-f]')) { S.f[el.dataset.f] = el.value; renderCandList(); }
  else if (el.id === 'period') { S.period = el.value; render(); }
  else if (el.id === 'rday') { S.rday = el.value || today(); render(); }
});
document.addEventListener('input', e => { if (e.target.id === 'fq') { S.f.q = e.target.value; renderCandList(); } });
document.addEventListener('submit', async e => {
  if (e.target.id === 'task-form') {
    e.preventDefault(); const fd = new FormData(e.target);
    await safe(() => put('tasks', { id: newId(), candId: '', kind: 'other', title: String(fd.get('title')).trim(), due: String(fd.get('due')), done: false }), t('Tarea agregada', 'Task added'));
  } else if (e.target.id === 'settings-form') {
    e.preventDefault(); const fd = new FormData(e.target), spend = {};
    const s = { ...S.settings };
    for (const [k, v] of fd.entries()) {
      if (k.startsWith('spend.')) { if (String(v).trim() !== '') spend[k.slice(6)] = Number(v); }
      else s[k] = ['company', 'myName', 'myPhone', 'applyLink'].includes(k) ? String(v).trim() : Number(v);
    }
    s.spend = spend;
    await safe(() => settingsDoc().set(s), t('Ajustes guardados', 'Settings saved'));
  }
});
$('#lang-es').onclick = () => { S.lang = 'es'; try { localStorage.setItem('rw.lang', 'es'); } catch {} render(); };
$('#lang-en').onclick = () => { S.lang = 'en'; try { localStorage.setItem('rw.lang', 'en'); } catch {} render(); };
$('#kiosk-open').onclick = () => {
  if (!S.ready) { toast(t('Primero abre la página con tu sesión iniciada en claude.ai.', 'Open the page signed in on claude.ai first.')); return; }
  openDlg(t('Modo registro', 'Registration mode'), `<p>${t('Pantalla para que los candidatos se registren solos en tu tableta o teléfono durante una feria o visita. No muestra a nadie más ni otros datos. Los registros llegan a tu base con la fuente que elijas.', 'A screen where candidates register themselves on your tablet or phone at a fair or visit. It shows no one else and no other data. Registrations land in your database with the source you choose.')}</p>
    <label class="f">${t('Fuente para estos registros', 'Source for these registrations')}<select id="k-src">${options(SOURCES, S.kioskSource || 'kiosk')}</select></label>
    <div><button class="btn" id="k-start">${t('Empezar', 'Start')}</button></div>`, d => {
    d.querySelector('#k-start').onclick = () => { S.kioskSource = d.querySelector('#k-src').value; d.close(); openKiosk(); };
  });
};
var d_close;
d_close = () => { const d = $('#dlg'); if (d.open) d.close(); };
render();
boot();
</script>
